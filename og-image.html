<!DOCTYPE html>
<!-- Design source for og-image.png. Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 --screenshot=/tmp/og-2x.png file://$PWD/og-image.html
     sips -z 630 1200 -s format png /tmp/og-2x.png --out og-image.png -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #0f172a;
    background-image:
      radial-gradient(circle at 88% 8%, rgba(37, 99, 235, 0.42) 0%, rgba(37, 99, 235, 0.10) 34%, rgba(15, 23, 42, 0) 62%),
      linear-gradient(135deg, #0f172a 0%, #101d33 55%, #0b1c2f 100%);
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 84px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .code-lines {
    position: absolute;
    right: 60px;
    bottom: 46px;
    font-family: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
    font-size: 21px;
    line-height: 1.65;
    color: rgba(96, 165, 250, 0.16);
    white-space: pre;
    text-align: right;
    letter-spacing: 0.5px;
  }
  .icon {
    flex-shrink: 0;
    width: 232px;
    height: 232px;
    border-radius: 46px;
    background: linear-gradient(160deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%);
    box-shadow: 0 26px 70px rgba(37, 99, 235, 0.42);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', Menlo, Monaco, 'Courier New', monospace;
    font-size: 132px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -6px;
  }
  .text { position: relative; z-index: 2; }
  h1 {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -2.5px;
    color: #f8fafc;
    line-height: 1.05;
  }
  h1 span { color: #60a5fa; }
  .sub {
    margin-top: 26px;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 7px;
    text-transform: uppercase;
    color: #94a3b8;
  }
  .tags { margin-top: 40px; display: flex; gap: 16px; }
  .tag {
    font-size: 25px;
    font-weight: 600;
    color: #bfdbfe;
    background: rgba(37, 99, 235, 0.18);
    border: 1.5px solid rgba(96, 165, 250, 0.38);
    border-radius: 999px;
    padding: 11px 26px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code-lines">{ "private": true,
  "upload": false,
  "offline": true }</div>
    <div class="icon">{}&zwj;</div>
    <div class="text">
      <h1>JSON<span>Tool</span></h1>
      <div class="sub">Format &middot; Minify &middot; Validate</div>
      <div class="tags">
        <div class="tag">Free online</div>
        <div class="tag">100% in your browser</div>
      </div>
    </div>
  </div>
</body>
</html>
